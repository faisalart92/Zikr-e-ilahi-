name: Build Zikr-e-Ilahi APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'Zikr-e-Ilahi-Home-and-Prayer-Location-Search.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - 'native/**'
      - 'assets/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Download complete Arabic Quran and Urdu translation for offline reading
        run: |
          mkdir -p assets/quran
          curl --fail --silent --show-error --location --retry 4 "https://api.alquran.cloud/v1/quran/quran-uthmani" -o assets/quran/quran-ar.json
          curl --fail --silent --show-error --location --retry 4 "https://api.alquran.cloud/v1/quran/ur.jalandhry" -o assets/quran/quran-ur.json
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['assets/quran/quran-ar.json', 'assets/quran/quran-ur.json']) {
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            const surahs = json.data && json.data.surahs;
            const count = Array.isArray(surahs) ? surahs.reduce((n, s) => n + (s.ayahs || []).length, 0) : 0;
            if (json.code !== 200 || !Array.isArray(surahs) || surahs.length !== 114 || count !== 6236) {
              throw new Error(file + ' failed Quran completeness validation: ' + surahs?.length + ' surahs, ' + count + ' ayahs');
            }
            console.log(file + ': validated 114 surahs and 6236 ayahs');
          }
          NODE

      - name: Prepare web app
        run: npm run build

      - name: Check embedded JavaScript syntax and required features
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('www/index.html', 'utf8');
          const scripts = html.split('<script').slice(1).map(part => part.slice(part.indexOf('>') + 1, part.indexOf('</script>')));
          if (!scripts.length) throw new Error('No inline JavaScript found');
          for (const [i, source] of scripts.entries()) new vm.Script(source, { filename: 'inline-' + i + '.js' });
          for (const feature of ['openQuran', 'loadPrayerTimes', 'loadQibla', 'countZikr', 'searchCity', 'enableAlerts']) {
            if (!html.includes('function ' + feature + '(') && !html.includes('async function ' + feature + '(')) {
              throw new Error('Missing required feature function: ' + feature);
            }
          }
          console.log('Inline JavaScript syntax and core feature checks passed.');
          NODE

      - name: Generate Android project
        run: npx cap add android

      - name: Download Adhan audio files
        run: |
          mkdir -p android/app/src/main/res/raw
          curl -fL --retry 3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_01_Fajr_Adhan.mp3" -o android/app/src/main/res/raw/adhan_fajr.mp3
          curl -fL --retry 3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_02_Dhuhr_Adhan.mp3" -o android/app/src/main/res/raw/adhan_dhuhr.mp3
          curl -fL --retry 3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_03_Asr_Adhan.mp3" -o android/app/src/main/res/raw/adhan_asr.mp3
          curl -fL --retry 3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_04_Maghrib_Adhan.mp3" -o android/app/src/main/res/raw/adhan_maghrib.mp3
          curl -fL --retry 3 "https://archive.org/download/adhan.recordings.from.doha.qatar/Adhan_Doha_Qatar_05_Isha_Adhan.mp3" -o android/app/src/main/res/raw/adhan_isha.mp3

      - name: Configure location permissions
        run: node scripts/patch-android-manifest.js

      - name: Configure native prayer alarms and Adhan service
        run: node scripts/patch-native-prayer.js

      - name: Apply green and gold launcher icon
        run: node scripts/set-android-icon.js

      - name: Apply branded native splash screen
        run: node scripts/patch-native-splash.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zikr-e-Ilahi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
